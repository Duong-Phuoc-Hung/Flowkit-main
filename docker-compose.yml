version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowkit-backend
    ports:
      - "8100:8100"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8100
      - WS_HOST=0.0.0.0
      - WS_PORT=9222
    volumes:
      - ./flow_agent.db:/app/flow_agent.db
      - ./exports:/app/exports
      - ./config:/app/config
    restart: unless-stopped

  frontend:
    build:
      context: ./flowkit-web
      dockerfile: Dockerfile
    container_name: flowkit-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
