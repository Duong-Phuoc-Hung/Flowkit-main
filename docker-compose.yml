version: '3.8'

services:
  backend:
    build: .
    container_name: flowkit-backend
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
    restart: unless-stopped

  frontend:
    build: ./flowkit-web
    container_name: flowkit-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./flowkit-web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8100
    depends_on:
      - backend
    restart: unless-stopped
